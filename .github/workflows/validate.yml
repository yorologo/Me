name: Validate

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes --package=vnu-jar@26.8.30 vnu --errors-only index.html

      - name: Test navigation, languages and theme
        run: node --test tests/site.test.mjs

      - name: Rebuild Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i ./assets/css/tailwind-input.css -o ./assets/css/site.generated.css --minify

      - name: Verify committed CSS
        run: |
          cmp assets/css/site.css assets/css/site.generated.css
          rm assets/css/site.generated.css
